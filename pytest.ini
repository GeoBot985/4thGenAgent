[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    slow: slow end-to-end or report-generation tests
    release: release-candidate verification tests
    gallery: manifest regression gallery tests
    integration: external integration tests
    live: tests requiring live services or credentials
norecursedirs =
    .git
    .hg
    .svn
    .tox
    .nox
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    .mypy_cache
    .claude
    worktrees
    runtime_data
    docs
    dist
    build
    optional_tools
    private_tools
    .clone
