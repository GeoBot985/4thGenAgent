[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unit: fast isolated unit tests
    backend: production backend API tests
    manifest: manifest parsing, contract, health, and gallery tests
    toolpack: toolpack contract, lifecycle, and governance tests
    runtime: TaskFrame runtime and orchestration tests
    reports: report, evidence, and portfolio pack tests
    smoke: bounded smoke tests
    integration: broader integration tests
    slow: slow tests not suitable for normal local runs
    live: tests requiring live/external systems
    full_ci: tests only intended for full CI or overnight validation
    release: release-candidate verification tests
    gallery: manifest regression gallery tests
norecursedirs =
    .git
    .hg
    .svn
    .tox
    .nox
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    .mypy_cache
    .claude
    worktrees
    runtime_data
    docs
    dist
    build
    optional_tools
    private_tools
    .clone
